name: Release

# The version comes from the top "## vX.Y.Z" heading in CHANGELOG.md, not from
# PR labels, so the README and changelog customers read always match the tag.
# main is protected, so the workflow cannot commit doc updates after the fact;
# the PR to main carries them and the check job enforces it.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check release docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Changelog, README and Dockerfile agree on an unreleased version
        run: |
          VERSION=$(scripts/release-check.sh)
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already released. Add a '## vX.Y.Z' section for the next version to CHANGELOG.md."
            exit 1
          fi
          echo "Will release $VERSION"

  release:
    name: Tag and release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create GitHub release
        run: |
          VERSION=$(scripts/release-check.sh)
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::warning::$VERSION already exists, skipping release. Bump the top CHANGELOG.md heading to release."
            exit 0
          fi
          scripts/release-check.sh notes > "$RUNNER_TEMP/notes.md"
          # --target creates the tag on this exact commit; generated PR list is appended after our notes.
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
