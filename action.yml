name: "Cloudanix Image Scanner"
description: "Image Scanner Scans container images for vulnerabilities with Policy based evaluation"
author: "Cloudanix"
branding:
  icon: "activity"
  color: "blue"
inputs:
  image:
    description: "Image to Scan"
    required: true
  authz-token:
    description: "Cloudanix Authorization Token"
    required: true
  identifier:
    description: "Cloudanix Account Identifier"
    required: true
  disable-policy-evaluation:
    description: "Disable Policy Evaluation"
    required: false
    default: "false"
  debug-mode:
    description: "Enable Debug Mode"
    required: false
    default: "false"

runs:
  using: "docker"
  image: "Dockerfile"
  # Each flag and its value must be separate list items. GitHub passes every
  # item here as a single, unsplit argv token to the container's ENTRYPOINT
  # (visible as `"-a value"` quoted-as-one in `docker run` invocations); a
  # combined "-a ${{ inputs.image }}" item means bash's `getopts` in
  # entrypoint.sh reads everything after the "a" -- including the space --
  # as OPTARG, producing an image reference with a leading space that always
  # fails to parse downstream.
  args:
    - "-a"
    - "${{ inputs.image }}"
    - "-b"
    - "${{ inputs.authz-token }}"
    - "-c"
    - "${{ inputs.identifier }}"
    - "-d"
    - "${{ inputs.disable-policy-evaluation }}"
    - "-e"
    - "${{ inputs.debug-mode }}"
